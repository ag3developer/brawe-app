name: brawe_app
description: "Brawe — Live your way. Live streaming, social marketplace and creator economy."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.49+60

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  dio: ^5.9.1
  go_router: ^17.1.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4
  socket_io_client: ^3.1.4
  video_player: ^2.9.2
  chewie: ^1.8.5
  path_provider: ^2.1.5
  wakelock_plus: ^1.2.11
  permission_handler: ^11.3.1
  # Cópia local com patches da Brawe (gancho de processamento de áudio no
  # iOS, bitrate). Ver packages/rtmp_broadcaster/BRAWE_PATCHES.md.
  rtmp_broadcaster:
    path: packages/rtmp_broadcaster
  share_plus: ^12.0.1
  cached_network_image: ^3.4.1
  # lucide_icons 0.257.0 está abandonada (3 anos sem manutenção) e usa
  # "class LucideIconData extends IconData", o que quebra no Dart 3.12+
  # pois IconData virou final class. lucide_icons_flutter é o fork mantido
  # que corrigiu essa incompatibilidade com a mesma API (LucideIcons.*).
  lucide_icons_flutter: ^3.1.15
  image_picker: ^1.2.2
  font_awesome_flutter: ^11.0.0
  firebase_core: ^4.8.0
  firebase_messaging: ^16.2.1
  firebase_crashlytics: ^5.0.0
  url_launcher: ^6.3.1
  flutter_local_notifications: ^21.0.0
  # Badge numérico no ícone do app (iOS nativo + launchers Android suportados).
  # Substitui o `flutter_app_badger` (descontinuado). Reflete notificações +
  # DMs não lidas — ver AppBadgeService / appBadgeControllerProvider.
  #
  # ⚠️ Versão pinada em ^1.3.1: a 1.3.0 quebra com AGP 9 porque o build.gradle
  # do plugin usa `kotlin {}` DSL sem aplicar `kotlin-android`. A 1.3.1 (jun/2026)
  # corrigiu exatamente esse bug. Não baixar.
  app_badge_plus: ^1.3.1
  connectivity_plus: ^7.1.1
  battery_plus: ^7.0.0
  camera: ^0.12.0+1
  webview_flutter: ^4.10.0
  record: ^5.2.1
  just_audio: ^0.9.43
  # SFX de baixa latência (degraus de combo, sons de presente); cai no
  # just_audio se a inicialização nativa falhar.
  flutter_soloud: ^3.1.0
  audio_session: ^0.1.21

  # ── QR Code: geração (meu perfil / login) + leitura (escanear) ────────
  # `qr_flutter` é puro Dart (sem deps nativas) — usado para renderizar o
  # QR code do próprio perfil na tela "Encontrar amigos" e no fluxo de
  # aprovação de QR login. `mobile_scanner` usa o pipeline de câmera nativo
  # (CameraX/AVFoundation), independente do plugin `camera` já usado pelo
  # broadcaster/story composer — não há conflito pois nunca são usados na
  # mesma tela simultaneamente.
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1

  # ── Trim/recorte de vídeo nativo ──────────────────────────────────────
  # video_trimmer 5.0+ usa APIs nativas (AVFoundation no iOS,
  # MediaCodec/MediaMuxer no Android via flutter_native_video_trimmer).
  # NÃO depende de ffmpeg_kit — o que evitaria ~25MB no APK e o
  # licenciamento LGPL/GPL do ffmpeg. Usado pelo Story Composer pra
  # cortar trechos do vídeo antes de publicar (ver story_video_trim_screen.dart).
  # Docs: https://pub.dev/packages/video_trimmer
  video_trimmer: ^5.0.0

  # ── Galeria do dispositivo (salvar no rolo) ──────────────────────────
  # `gal` é o sucessor moderno do image_gallery_saver (descontinuado).
  # Usa Photos framework (iOS) / MediaStore (Android) sem dependências
  # nativas pesadas. Usado pelo Story Composer pra "Salvar no dispositivo"
  # após editar foto/vídeo (botão de download na top bar do editor).
  # Docs: https://pub.dev/packages/gal
  gal: ^2.3.0

  # ── UUIDs para Idempotency-Key ───────────────────────────────────────
  # Evita stories duplicados quando o usuário toca "Compartilhar" várias
  # vezes em redes lentas. Cada sessão do composer gera 1 UUID único que
  # vai como header `Idempotency-Key` em todos os retries do POST.
  # Backend persiste em stories.idempotency_key (UNIQUE) e devolve o
  # registro existente em vez de criar duplicata.
  uuid: ^4.5.1

  # ── In-App Purchase ──────────────────────────────────────────────────────
  # Compras de coins dentro do app são OBRIGATORIAMENTE feitas via Google
  # Play Billing (Android) e StoreKit (iOS), conforme política das lojas
  # para conteúdo digital consumido dentro do app. Wolknow/PIX só pode ser
  # usado na versão web (brawe.app), nunca dentro do APK/IPA publicado.
  # Docs: https://pub.dev/packages/in_app_purchase
  in_app_purchase: ^3.2.1

  # Versão do app (lida do pubspec/Info.plist/AndroidManifest em runtime).
  package_info_plus: ^8.0.0
  device_info_plus: ^12.4.0
  lottie: ^3.5.1
  flutter_volume_controller: ^2.0.2
  flutter_vap_player: ^2.2.0
  firebase_remote_config: ^6.7.1
  fl_chart: ^1.3.0
  geolocator: ^14.0.2
  # Geocodificação reversa NO APARELHO (cidade/UF do post). Sem API paga.
  geocoding: ^4.0.0
  file_picker: ^11.0.3
  get_thumbnail_video: ^0.7.3
  livekit_client: 2.11.0
  maplibre_gl: ^0.28.0
  visibility_detector: ^0.4.0+2

# ── Overrides ──────────────────────────────────────────────────────────────
# path_provider_foundation 2.6.0+ migrou para FFI usando `objective_c`, que
# requer Native Assets habilitado no Flutter. Sem isso, o framework
# `objective_c.framework` não é empacotado no .app/.ipa e o app crasha em
# runtime no simulador/device com `dlopen` failure ao chamar
# `getTemporaryDirectory()`. Pinar versão antiga (channel method) até o
# Flutter habilitar Native Assets por padrão.
dependency_overrides:
  path_provider_foundation: 2.4.1
  record_linux: 1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/quests/
    - assets/images/gifts/
    - assets/images/gifts/free/
    - assets/images/gifts/basic/
    - assets/images/gifts/premium/
    - assets/images/gifts/luxury/
    - assets/images/gifts/legendary/
    - assets/images/illustrations/
    - assets/images/illustrations/2.0x/
    - assets/images/illustrations/3.0x/
    - assets/sounds/
    - assets/legal/
    - assets/lottie_test/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  image_path: "assets/images/brawe-icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#0A0A0F"
  min_sdk_android: 24
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: "assets/images/brawe-icon.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
